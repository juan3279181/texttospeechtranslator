<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Multi-Language Translator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; color: #333; }
        .container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 90%; max-width: 650px; text-align: center; }
        h2 { margin-top: 0; color: #4a4a4a; font-size: 28px; }
        .controls { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }
        select, button { padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 15px; outline: none; transition: all 0.3s; }
        select:focus { border-color: #667eea; }
        #swap-btn { background: #f8f9fa; cursor: pointer; border: 1px solid #ddd; }
        #swap-btn:hover { background: #e2e6ea; }
        textarea { width: 100%; height: 140px; padding: 15px; border: 1px solid #eee; border-radius: 10px; box-sizing: border-box; resize: none; margin-bottom: 15px; font-size: 16px; background: #fafafa; }
        textarea:focus { border-color: #667eea; background: #fff; }
        .btns { display: flex; gap: 12px; }
        button { cursor: pointer; font-weight: 600; }
        #translate-btn { background: #667eea; color: white; border: none; flex: 2; box-shadow: 0 4px 10px rgba(102, 126, 234, 0.3); }
        #translate-btn:hover { background: #5a67d8; transform: translateY(-1px); }
        #audio-btn { background: #48bb78; color: white; border: none; flex: 1; box-shadow: 0 4px 10px rgba(72, 187, 120, 0.3); }
        #audio-btn:hover { background: #38a169; transform: translateY(-1px); }
        .footer { margin-top: 25px; font-size: 13px; color: #888; border-top: 1px solid #eee; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Global Translator</h2>
    <div class="controls">
        <select id="from-lang"><option value="en-GB">English</option></select>
        <button id="swap-btn" title="Swap Languages">⇄</button>
        <select id="to-lang"></select>
    </div>
    <textarea id="input-text" placeholder="Type something to translate..."></textarea>
    <textarea id="output-text" placeholder="Translation will appear here..." readonly></textarea>
    <div class="btns">
        <button id="translate-btn">Translate Now</button>
        <button id="audio-btn">🔊 Listen</button>
    </div>
    <div class="footer">
        © 2024 Global Translator Tool • Free & Fast
    </div>
</div>

<script>
    const languages = {
        "en-GB": "English", "es-ES": "Spanish", "fr-FR": "French", "de-DE": "German", 
        "it-IT": "Italian", "hi-IN": "Hindi", "ja-JP": "Japanese", "ko-KR": "Korean",
        "zh-CN": "Chinese", "ru-RU": "Russian", "ar-SA": "Arabic", "pt-PT": "Portuguese"
    };

    const fromSelect = document.getElementById("from-lang");
    const toSelect = document.getElementById("to-lang");
    const inputText = document.getElementById("input-text");
    const outputText = document.getElementById("output-text");

    // Populate Lists
    Object.entries(languages).forEach(([code, name]) => {
        if(code !== "en-GB") fromSelect.add(new Option(name, code));
        toSelect.add(new Option(name, code));
    });
    toSelect.value = "es-ES";

    // Translation Fix: Using a direct URL method that browsers rarely block
    document.getElementById("translate-btn").onclick = function() {
        const text = inputText.value.trim();
        if(!text) return;
        
        outputText.value = "Translating...";
        const from = fromSelect.value;
        const to = toSelect.value;
        
        // Using MyMemory API with a fallback error catch
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}|${to}`;
        
        fetch(url)
            .then(res => res.json())
            .then(data => {
                if(data.responseData && data.responseData.translatedText) {
                    outputText.value = data.responseData.translatedText;
                } else {
                    outputText.value = "Error: " + (data.responseDetails || "Limit reached.");
                }
            })
            .catch(() => {
                outputText.value = "Connection error. Try on a live server.";
            });
    };

    // Audio Fix: Ensure voice is set correctly
    document.getElementById("audio-btn").onclick = function() {
        if (!outputText.value || outputText.value === "Translating...") return;
        
        const utterance = new SpeechSynthesisUtterance(outputText.value);
        utterance.lang = toSelect.value; // Matches the language sound
        window.speechSynthesis.cancel(); // Clear any pending speech
        window.speechSynthesis.speak(utterance);
    };

    // Swap Logic
    document.getElementById("swap-btn").onclick = () => {
        const temp = fromSelect.value;
        fromSelect.value = toSelect.value;
        toSelect.value = temp;
    };
</script>

</html>
